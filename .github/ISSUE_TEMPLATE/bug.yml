name: Bug report
description: "Expected behavior, actual behavior, minimal synthetic reproduction, version or commit, and test output."
labels: ["bug"]
body:
  - type: textarea
    id: details
    attributes:
      label: Details
      description: "Expected behavior, actual behavior, minimal synthetic reproduction, version or commit, and test output."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report
      options:
        - label: This report contains only synthetic data and no private vulnerability details.
          required: true
