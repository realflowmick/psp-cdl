name: Sustained differential fuzzing
on:
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: [360034, 360035, 360039]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: python -m pip install uv==0.10.4
      - run: uv sync --locked --all-packages
      - run: uv run --locked python scripts/differential-fuzz.py --seed ${{ matrix.seed }} --cases 4096 --seconds 600
