name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
  python:
    name: Python (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.10.4
      - run: uv sync --locked --all-packages --python ${{ matrix.python }}
      - run: uv run --locked python -m unittest discover -s implementations/python/tests -v
  parity:
    name: Cross-language library parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.10.4
      - run: npm ci
      - run: npm run build
      - run: uv sync --locked --all-packages
      - run: uv run --locked python scripts/check-parity.py
      - run: uv run --locked python scripts/generate-codec-vectors.py --check
      - run: uv run --locked python scripts/generate-service-contracts.py --check
      - run: uv run --locked python scripts/generate-persistence-schema.py --check
      - run: uv run --locked python scripts/generate-workflow-contracts.py --check
      - run: uv run --locked python scripts/generate-workflow-vectors.py --check
      - run: uv run --locked python scripts/generate-llm-vectors.py --check
      - run: uv run --locked python scripts/check-packages.py
  required:
    name: Repository checks
    if: always()
    needs: [typescript, python, parity]
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix and parity jobs
        env:
          TS: ${{ needs.typescript.result }}
          PY: ${{ needs.python.result }}
          PARITY: ${{ needs.parity.result }}
        run: |
          test "$TS" = success
          test "$PY" = success
          test "$PARITY" = success
