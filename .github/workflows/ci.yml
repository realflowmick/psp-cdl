name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
  python:
    name: Python (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.10.4
      - run: uv sync --locked --all-packages --python ${{ matrix.python }}
      - run: uv run --locked python -m unittest discover -s implementations/python/tests -v
  parity:
    name: Cross-language library parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.10.4
      - run: npm ci
      - run: npm run build
      - run: uv sync --locked --all-packages
      - run: uv run --locked python scripts/check-parity.py
      - name: Retain synthetic minimized regression
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-fuzz-reproducer
          path: .artifacts/fuzz-failure.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
      - run: uv run --locked python scripts/generate-codec-vectors.py --check
      - run: uv run --locked python scripts/generate-service-contracts.py --check
      - run: uv run --locked python scripts/generate-persistence-schema.py --check
      - run: uv run --locked python scripts/generate-workflow-contracts.py --check
      - run: uv run --locked python scripts/generate-workflow-vectors.py --check
      - run: uv run --locked python scripts/generate-lifecycle-contracts.py --check
      - run: uv run --locked python scripts/generate-lifecycle-vectors.py --check
      - run: uv run --locked python scripts/generate-security-tools-contracts.py --check
      - run: uv run --locked python scripts/generate-security-tools-vectors.py --check
      - run: uv run --locked python scripts/generate-api-candidate.py --check
      - run: uv run --locked python scripts/generate-llm-vectors.py --check
      - run: uv run --locked python scripts/generate-durable-vectors.py --check
      - run: uv run --locked python scripts/generate-refresh-vectors.py --check
      - run: uv run --locked python scripts/generate-refresh-schema.py --check
      - run: uv run --locked python scripts/generate-mcp-refresh-contract.py --check
      - run: uv run --locked python scripts/generate-mcp-refresh-vectors.py --check
      - run: uv run --locked python scripts/generate-redirect-schema.py --check
      - run: uv run --locked python scripts/generate-redirect-vectors.py --check
      - run: uv run --locked python scripts/generate-scoped-schema.py --check
      - run: uv run --locked python scripts/generate-scoped-vectors.py --check
      - run: uv run --locked python scripts/generate-provider-artifacts.py --check
      - run: uv run --locked python scripts/check-packages.py
  required:
    name: Repository checks
    if: always()
    needs: [typescript, python, parity]
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix and parity jobs
        env:
          TS: ${{ needs.typescript.result }}
          PY: ${{ needs.python.result }}
          PARITY: ${{ needs.parity.result }}
        run: |
          test "$TS" = success
          test "$PY" = success
          test "$PARITY" = success
