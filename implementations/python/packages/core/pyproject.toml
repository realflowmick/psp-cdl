[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "psp-cdl-core"
version = "0.1.0.dev0"
description = "PSP parsing, canonicalization, signatures, provenance, and workflow contracts"
requires-python = ">=3.12"
dependencies = ["rfc8785==0.1.4", "cryptography==50.0.1"]
license = "Apache-2.0"
readme = "README.md"
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[tool.hatch.build.targets.wheel]
packages = ["src/psp_cdl_core"]
