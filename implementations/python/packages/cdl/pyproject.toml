[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "psp-cdl-cdl"
version = "0.1.0.dev0"
description = "CDL parsing, inheritance, vocabulary, and deterministic policy decisions"
requires-python = ">=3.12"
dependencies = ["psp-cdl-core==0.1.0.dev0"]
license = "(Apache-2.0 AND CC0-1.0)"
readme = "README.md"
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[tool.hatch.build.targets.wheel]
packages = ["src/psp_cdl_cdl"]
