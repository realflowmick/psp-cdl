[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "psp-cdl-llmproxy"
version = "0.1.0.dev0"
description = "Provider-neutral model gateway and authoritative tool-dispatch loop"
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
classifiers = ["Development Status :: 1 - Planning", "Programming Language :: Python :: 3"]

[tool.hatch.build.targets.wheel]
packages = ["src/psp_cdl_llmproxy"]
